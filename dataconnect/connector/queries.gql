
query ListEarthquakes @auth(level: PUBLIC) {
  earthquakes(orderBy: [{ eventTimestamp: DESC }]) {
    usgsEventId
    magnitude
    locationDescription
    depthKm
    latitude
    longitude
    eventTimestamp
  }
}

mutation UpsertMember(
  $email: String!
  $displayName: String!
  $createdAt: Timestamp!
) @auth(level: USER) {
  member_upsert(
    data: {
      authUid_expr: "auth.uid"
      email: $email
      displayName: $displayName
      createdAt: $createdAt
      lastLoginAt_expr: "request.time"
    }
  )
}

mutation UpsertEarthquake(
  $usgsEventId: String!
  $magnitude: Float!
  $locationDescription: String
  $depthKm: Float!
  $latitude: Float!
  $longitude: Float!
  $eventTimestamp: Timestamp!
) @auth(level: PUBLIC) {
  earthquake_upsert(
    data: {
      usgsEventId: $usgsEventId
      magnitude: $magnitude
      locationDescription: $locationDescription
      depthKm: $depthKm
      latitude: $latitude
      longitude: $longitude
      eventTimestamp: $eventTimestamp
    }
  )
}
